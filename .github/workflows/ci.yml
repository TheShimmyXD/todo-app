# Continuous integration: the same checks CONTRIBUTING.md asks for before a PR
# (lint, typecheck, tests and build of each package), on every push to main and
# on every pull request. A red run blocks the merge until it is fixed.
#
# Versions follow the rest of the repository: Node matches the base image of
# both Dockerfiles and PostgreSQL matches docker-compose.yml. When one of them
# changes, change it here too so CI tests what actually runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The tests talk to a real PostgreSQL. tests/global-setup.ts creates the
    # todo_test database and applies the migrations, as it does on a laptop.
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Same values as .env.example; they only exist inside this runner.
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo
      TEST_DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # No database here: `prisma generate` only reads backend/prisma/schema.prisma
    # (which the checkout brings along) and the page is rendered per request,
    # so `next build` never connects to PostgreSQL.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
